    <text x="51" y="66">Mon</text><text x="107" y="66">Tue</text><text x="163" y="66">Wed</text><text x="219" y="66">Thu</text><text x="275" y="66">Fri</text><text x="331" y="66">Sat</text><text x="387" y="66">Sun</text>
