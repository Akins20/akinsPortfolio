<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" fill="none">
  <rect x="12.5" y="12.5" width="535" height="335" rx="14" class="fill-surface stroke-line-strong"/>
  <path d="M12.5 40.5h535M318.5 40.5v307" class="stroke-line"/>
  <circle cx="30" cy="26.5" r="4" class="fill-line-strong"/><circle cx="43" cy="26.5" r="4" class="fill-line-strong"/><circle cx="56" cy="26.5" r="4" class="fill-line-strong"/>
  <text x="280" y="30" text-anchor="middle" font-size="10" letter-spacing=".12em" class="fill-muted">FREYA</text>
  <circle cx="486" cy="26.5" r="3" class="fill-ok"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="494" y="29.5" font-size="8.5" class="fill-ok">listening</text>

  <!-- Conversation -->
  <rect x="92" y="54" width="212" height="38" rx="11" class="fill-surface-2"/>
  <text x="104" y="70" font-size="10" class="fill-fg font-sans">Build a four-page site for my</text>
  <text x="104" y="83" font-size="10" class="fill-fg font-sans">plant nursery</text>

  <g font-size="9">
    <text x="28" y="116" class="fill-accent">→</text><text x="42" y="116" class="fill-muted">file_write</text><text x="112" y="116" class="fill-fg">4 pages</text>
    <text x="28" y="136" class="fill-accent">→</text><text x="42" y="136" class="fill-muted">site_check</text><text x="112" y="136" class="fill-danger">contact form goes nowhere</text>
    <text x="28" y="156" class="fill-accent">→</text><text x="42" y="156" class="fill-muted">file_edit</text><text x="112" y="156" class="fill-fg">contact.html</text>
    <text x="28" y="176" class="fill-accent">→</text><text x="42" y="176" class="fill-muted">site_check</text><text x="112" y="176" class="fill-ok">4 pages, no dead ends</text>
    <text x="28" y="196" class="fill-accent">→</text><text x="42" y="196" class="fill-muted">review</text><text x="112" y="196" class="fill-fg">3 weakest parts</text>
    <text x="28" y="216" class="fill-accent">→</text><text x="42" y="216" class="fill-muted">file_write</text><text x="112" y="216" class="fill-fg">×4, rewritten</text>
    <text x="28" y="236" class="fill-accent">→</text><text x="42" y="236" class="fill-muted">site_check</text><text x="112" y="236" class="fill-ok">still clean ✓</text>
  </g>

  <rect x="26.5" y="256.5" width="278" height="56" rx="11" class="fill-accent/10 stroke-accent/40"/>
  <text x="40" y="277" font-size="10" class="fill-fg font-sans"><tspan class="fill-ok" font-weight="600">Done.</tspan> Four pages, every link checked,</text>
  <text x="40" y="291" font-size="10" class="fill-fg font-sans">open on your screen now.</text>
  <text x="40" y="304" font-size="8" class="fill-subtle">nobody asked her to check the form</text>
  <rect x="26.5" y="322.5" width="278" height="14" rx="7" class="fill-surface-2"/>
  <text x="38" y="332" font-size="7.5" class="fill-subtle">Ask FREYA anything, or hold space to talk…</text>

  <!-- Result preview -->
  <text x="334" y="60" font-size="8" letter-spacing=".12em" class="fill-subtle">PREVIEW</text>
  <rect x="332.5" y="68.5" width="202" height="206" rx="9" class="fill-bg/50 stroke-line"/>
  <text x="346" y="92" font-size="12" class="fill-fg font-display">Green Leaf Nursery</text>
  <g class="fill-muted/60"><rect x="474" y="85" width="14" height="4" rx="2"/><rect x="492" y="85" width="14" height="4" rx="2"/><rect x="510" y="85" width="14" height="4" rx="2"/></g>
  <rect x="346" y="102" width="176" height="74" rx="7" class="fill-ok/15"/>
  <g class="fill-ok/55">
    <ellipse cx="480" cy="146" rx="9" ry="22" transform="rotate(-25 480 146)"/>
    <ellipse cx="498" cy="146" rx="8" ry="19" transform="rotate(20 498 146)"/>
    <ellipse cx="462" cy="152" rx="7" ry="15" transform="rotate(-50 462 152)"/>
  </g>
  <rect x="356" y="120" width="86" height="8" rx="2.5" class="fill-fg"/>
  <rect x="356" y="133" width="64" height="8" rx="2.5" class="fill-fg"/>
  <rect x="356" y="152" width="46" height="14" rx="7" class="fill-ok"/>
  <g>
    <rect x="346" y="188" width="54" height="40" rx="5" class="fill-surface-2"/><rect x="407" y="188" width="54" height="40" rx="5" class="fill-surface-2"/><rect x="468" y="188" width="54" height="40" rx="5" class="fill-surface-2"/>
    <circle cx="373" cy="205" r="8" class="fill-ok/40"/><circle cx="434" cy="205" r="8" class="fill-accent/40"/><circle cx="495" cy="205" r="8" class="fill-ok/40"/>
  </g>
  <g class="fill-muted/40"><rect x="346" y="238" width="160" height="5" rx="2"/><rect x="346" y="249" width="120" height="5" rx="2"/></g>
  <g font-size="8.5" class="font-sans">
    <rect x="332.5" y="286.5" width="96" height="20" rx="10" class="fill-ok/10 stroke-ok/40"/><text x="380.5" y="299.5" text-anchor="middle" class="fill-ok">4 pages</text>
    <rect x="434.5" y="286.5" width="100" height="20" rx="10" class="fill-ok/10 stroke-ok/40"/><text x="484.5" y="299.5" text-anchor="middle" class="fill-ok">0 broken links</text>
  </g>
  <text x="332" y="330" font-size="8" class="fill-subtle">Go · no dependencies · one binary</text>
</svg>
